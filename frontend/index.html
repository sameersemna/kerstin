<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kerstin</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Voice activity detection (Silero VAD in the browser). Pinned versions; vendor locally later (see ROADMAP). -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.22/dist/bundle.min.js"></script>
</head>
<body>
  <header>
    <h1>Kerstin <span class="sub">Deutsch sprechen · B2</span></h1>
    <div class="controls">
      <select id="scenario" aria-label="Szenario"></select>
      <select id="micMode" aria-label="Mikrofon-Modus">
        <option value="speakers">Lautsprecher (Mikro pausiert, während Kerstin spricht)</option>
        <option value="headphones">Kopfhörer (einfach dazwischenreden)</option>
      </select>
      <select id="feedbackLang" aria-label="Sprache der Erklärungen">
        <option value="en">Erklärungen: Englisch</option>
        <option value="de">Erklärungen: Deutsch</option>
      </select>
      <button id="startBtn" class="primary">Gespräch starten</button>
      <button id="endBtn" disabled>Beenden &amp; Feedback</button>
      <button id="interruptBtn" disabled>Unterbrechen</button>
    </div>
  </header>

  <main>
    <section id="log" aria-live="polite"></section>
    <aside>
      <div id="state" class="state idle">bereit</div>
      <div id="metrics" class="metrics">–</div>
      <div class="hint-box">
        <h2>Wie sagt man …?</h2>
        <div class="hint-form">
          <input id="hintInput" maxlength="120" placeholder="z. B. notice period" autocomplete="off" disabled />
          <button id="hintBtn" disabled>Fragen</button>
        </div>
        <div id="hintList"></div>
        <p class="hint-note">KI-Antwort – kann Fehler enthalten. Im Zweifel im Wörterbuch prüfen.</p>
      </div>
      <div id="feedback" class="feedback" hidden></div>
    </aside>
  </main>

  <footer>
    Läuft lokal. Mikrofon braucht HTTPS oder <code>localhost</code> – siehe README (HTTPS im LAN).
  </footer>

  <script src="mic_gate.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
