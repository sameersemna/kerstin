[project]
name = "kerstin"
version = "0.1.0"
description = "Kerstin — local German B2 speaking partner (Whisper + Ollama + Piper)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
local-stt = ["faster-whisper>=1.0", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kerstin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
